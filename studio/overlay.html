<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>Haiku Overlay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    /* dark panels */
    --panel: rgba(18,18,24,.9); --edge: rgba(255,255,255,.08);
    --text: #E6E6EA; --text-2: #C9C9D1; --dim: #8A8A96; --tool: #61D6D6;
    --think: #7FB2FF; --act: #F2A93B; --bad: #FF6B6B; --ok-mark: #16C60C; --bad-mark: #E74856;
    /* parchment cards (new day, diary) */
    --parch: #F6E7C1; --parch-2: #E9D29C; --wood: #7A4A22; --wood-dk: #4A2C14;
    --ink: #2B1A0B; --ink-2: #6B4E2E; --ink-3: #5A4026; --night: #2C3E73;
    --hud-clear: 340px;  /* bottom-left strip left free for the game's HUD messages */
  }
  html, body { margin: 0; background: transparent; overflow: hidden; }
  body { width: 1920px; height: 1080px; position: relative; font-family: "Mitr", "Leelawadee UI", "Tahoma", sans-serif; color: var(--text); }
  .hide { display: none !important; }
  body:not(.i18n) { visibility: hidden; } /* nothing shows until the language is known (no flash of the wrong one) */

  .panel { box-sizing: border-box; padding: 14px 18px; background: var(--panel); border: 1px solid var(--edge);
           border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,.35); }
  .label { font-size: 14px; letter-spacing: .08em; color: var(--dim); margin-bottom: 6px; }

  /* top-left status: only what the game itself does not show */
  #status { position: absolute; left: 24px; top: 24px; width: 480px; display: flex; flex-direction: column; gap: 6px; }
  #status .line1 { display: flex; align-items: baseline; gap: 10px; font-size: 26px; font-weight: 600; line-height: 1.2; }
  #status .muted { font-weight: 400; color: var(--dim); }
  #status .place { font-weight: 400; color: var(--text-2); }
  #status .line2 { display: flex; align-items: center; gap: 10px; font-size: 18px; line-height: 1.4; color: var(--text-2); }
  #status .dot { flex: none; width: 10px; height: 10px; border-radius: 50%; background: var(--dim); }
  #runnerLine { color: var(--act); }  /* runner status from POST /api/meta {"runnerStatus": "..."}, e.g. waiting for the usage limit */
  #runnerLine .dot { background: var(--act); }

  /* run control: shown while the operator has paused or stopped the run (state.paused / state.stopNow) */
  #pauseBadge { position: absolute; left: 50%; top: 24px; transform: translateX(-50%); padding: 10px 30px; border-radius: 10px;
                background: rgba(231,72,86,.94); color: #fff; font-size: 34px; font-weight: 600; box-shadow: 0 8px 24px rgba(0,0,0,.35); }

  /* the game stacks HUD messages ("+1 Parsnip", "Inventory full") up from the bottom-left corner: keep that strip clear */
  #col { position: absolute; left: 24px; top: 134px; bottom: var(--hud-clear); width: 480px; display: flex; flex-direction: column; gap: 16px;
         font-family: "Cascadia Mono", "Cascadia Code", Consolas, "Mitr", monospace; }
  #col > .panel { flex-shrink: 0; }
  body.npc #col { bottom: auto; }
  body.runner #col { top: 166px; }  /* the status panel has one extra line while the runner posts a status */

  #logPanel { font-size: 19px; line-height: 1.5; }
  #logPanel .label { margin-bottom: 8px; }
  .hist { display: flex; align-items: center; gap: 12px; }
  .hist .tool { flex: none; width: 7ch; color: var(--tool); }
  .hist .why { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hist .mark { flex: none; }
  #proof { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--edge); font-size: 14px; line-height: 1.6; color: var(--dim); }
  #proof .live { color: var(--bad-mark); }

  #actPanel { font-size: 20px; line-height: 1.5; }
  #actLine { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* fills whatever height is left above the HUD strip; long thoughts clip at the top so the newest words stay visible */
  #col > #thinkPanel { margin-top: auto; flex-shrink: 1; min-height: 0; display: flex; flex-direction: column; font-size: 22px; line-height: 1.5; }
  #replyPanel { font-size: 22px; line-height: 1.5; }
  .textwrap { overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; }
  #thinkPanel .textwrap { min-height: 0; }
  #replyPanel .textwrap { max-height: 230px; } /* column must end above the game's dialogue box (~y 684) */
  .caret { color: var(--think); }

  body.npc #logPanel, body.npc #thinkPanel { display: none; }
  body:not(.npc) #replyPanel { display: none; }

  /* full-screen parchment cards */
  .scrim { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
           opacity: 0; transition: opacity .5s; pointer-events: none; }
  .scrim.show { opacity: 1; }
  .parch { box-sizing: border-box; background: var(--parch); color: var(--ink); border: 8px solid var(--wood); border-radius: 12px;
           box-shadow: inset 0 0 0 4px var(--parch-2), 0 0 0 5px var(--wood-dk), 0 12px 0 5px rgba(0,0,0,.4); }

  #daycard { background: rgba(20,12,4,.55); }
  #daycard .card { width: 900px; display: flex; flex-direction: column; align-items: center; gap: 18px; padding: 40px 56px 44px; }
  #daycard .season { font-size: 32px; font-weight: 500; color: var(--ink-2); }
  #daycard .big { display: flex; align-items: baseline; gap: 22px; line-height: .9; }
  #daycard .big .w { font-size: 72px; font-weight: 600; }
  #daycard .big .num { font-size: 190px; font-weight: 600; color: var(--wood-dk); }
  #daycard .big .of { font-size: 64px; font-weight: 500; color: var(--ink-2); }
  #cells { display: flex; flex-wrap: wrap; gap: 3px; width: 700px; }
  #cells i { width: 32px; height: 18px; border-radius: 2px; background: #E2C990; }
  #cells i.past { background: #2F6B22; } #cells i.now { background: #E8962E; }
  #daycard .stats { display: flex; gap: 16px; margin-top: 8px; }
  #daycard .stat { display: flex; flex-direction: column; align-items: center; padding: 10px 22px; background: var(--parch-2); border-radius: 8px; min-width: 170px; }
  #daycard .stat span:first-child { font-size: 20px; color: var(--ink-3); }
  #daycard .stat span:last-child { font-weight: 600; font-size: 34px; }

  #diary { background: rgba(12,20,52,.72); }
  #diary .card { width: 1200px; height: 700px; display: flex; flex-direction: column; gap: 22px; padding: 48px 64px; box-shadow: inset 0 0 0 4px var(--parch-2), 0 0 0 5px var(--wood-dk), 0 12px 0 5px rgba(0,0,0,.45); }
  #diary .head { display: flex; align-items: center; justify-content: space-between; }
  #diary .title { display: flex; flex-direction: column; gap: 4px; }
  #diary .title span:first-child { font-size: 54px; font-weight: 600; color: var(--wood-dk); line-height: 1.1; }
  #diary .title span:last-child { font-size: 28px; color: var(--ink-2); }
  #diary .badge { display: flex; align-items: center; gap: 10px; padding: 10px 18px; background: var(--night); color: #fff; border-radius: 8px; font-size: 24px; font-weight: 500; }
  #diary .rule { height: 4px; background: #D9BE85; border-radius: 2px; }
  #diaryText { flex: 1; min-height: 0; overflow: hidden; font-size: 44px; line-height: 1.5; white-space: pre-line; }
  #diaryText.long { font-size: 34px; } #diaryText.longer { font-size: 28px; }
  #diary .foot { display: flex; justify-content: space-between; align-items: center; font-size: 18px; color: var(--ink-3); }
  #diary .zzz { font-weight: 600; font-size: 40px; color: var(--wood); }
</style>
</head>
<body>
  <div id="pauseBadge" class="hide" data-i18n="pausedBadge"></div>
  <div id="status" class="panel">
    <div class="line1">
      <span><span data-i18n="dayWord"></span> <span id="day">–</span><span class="muted">/100</span></span>
      <span class="muted">·</span>
      <span class="place" id="place">–</span>
    </div>
    <div class="line2"><span class="dot" id="modeDot"></span><span id="modeText" data-i18n="waiting"></span></div>
    <div class="line2 hide" id="runnerLine"><span class="dot"></span><span id="runnerText"></span></div>
  </div>

  <div id="col">
    <div id="replyPanel" class="panel">
      <div class="label" id="replyLabel" data-i18n="labelReply"></div>
      <div class="textwrap"><div id="replyText">…</div></div>
    </div>

    <div id="logPanel" class="panel">
      <div class="label" data-i18n="labelLog"></div>
      <div id="hist"></div>
      <div id="proof"></div>
    </div>

    <div id="actPanel" class="panel">
      <div class="label" data-i18n="labelAction"></div>
      <div id="actLine" data-i18n="actIdle"></div>
    </div>

    <div id="thinkPanel" class="panel">
      <div class="label" data-i18n="labelThinking"></div>
      <div class="textwrap"><div id="thinkText">…</div></div>
    </div>
  </div>

  <div id="daycard" class="scrim"><div class="card parch">
    <div class="season" id="dcSeason"></div>
    <div class="big"><span class="w" data-i18n="dayWord"></span><span class="num" id="dcDay"></span><span class="of">/ 100</span></div>
    <div id="cells"></div>
    <div class="stats">
      <div class="stat"><span data-i18n="statMoney"></span><span id="dcMoney">–</span></div>
      <div class="stat"><span data-i18n="statOk"></span><span id="dcOk" style="color:#2F6B22">–</span></div>
      <div class="stat"><span data-i18n="statBad"></span><span id="dcBad" style="color:#A82A20">–</span></div>
    </div>
  </div></div>

  <div id="diary" class="scrim"><div class="card parch">
    <div class="head">
      <div class="title"><span id="dyTitle" data-i18n="diaryWord"></span><span id="dySub"></span></div>
      <div class="badge">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
        <span data-i18n="inBed"></span>
      </div>
    </div>
    <div class="rule"></div>
    <div id="diaryText"></div>
    <div class="foot"><span id="dyFoot"></span><span class="zzz">Zzz</span></div>
  </div></div>

<script>
// ====== i18n:begin ======================================================================================
// Every viewer-facing string of this page. The mod reports ThoughtLanguage in /api/feed (`thoughtLanguage`);
// ?lang=Thai|English overrides it. `en` is the complete base table; the other tables only list what differs,
// and a missing key falls back to `en`. To add a language: add a table under its code (ja, ...) and, when its
// ThoughtLanguage name differs from the code, a LANG_NAMES entry. A language without a table shows `en`.
const LANG_NAMES = { thai: "th", english: "en" };
const I18N = {
  en: {
    waiting: "Waiting for game…",
    pausedBadge: "Paused", stoppedBadge: "Run stopped",
    modeHeldAction: (stopNow, verb) => `${stopNow ? "Run stopped" : "Paused"} · waiting for ${verb} to finish`,
    dayWord: "Day", diaryWord: "Diary",
    labelReply: "REPLY", labelLog: "LOG", labelAction: "ACTION", labelThinking: "MODEL THINKING",
    replyTo: who => `REPLY TO ${who}`,
    liveWord: "LIVE", sessionWord: "session", seqWord: "seq",
    // ACTION line
    actIdle: "Now: ?", actReplyIdle: "Reply: ?", actThinking: "Thinking…",
    actDoing: verb => `Now: ${verb}`,
    actResult: (ok, line, mark = ok ? "✓" : "✗") => `Result: ${mark} ${line}`,
    // top-left status line
    modeRunning: "Time running",
    modeRunningAction: verb => `Time running · ${verb}…`,
    modeFrozenTalk: who => `Time frozen · talking to ${who}`,
    modeFrozenThink: who => `Time frozen · ${who} is thinking`,
    // day card and diary card
    statMoney: "Money yesterday", statOk: "Succeeded", statBad: "Failed", inBed: "In bed",
    dayCardSeason: (season, dom, year) => `${season} ${dom} · Year ${year}`,
    diarySub: (day, season, dom, year) => `Night of day ${day} · ${season} ${dom} · Year ${year}`,
    diaryTitle: who => `${who}'s diary`,
    // result lines
    optionN: n => `option ${n}`, optionNext: "continue",
    resultDone: "done", resultFailed: "failed",
    stoppedShort: (x, y) => `Stopped short at (${x},${y})`,
    reasons: {
      partial: "partial", low_energy: "low_energy", no_path: "no_path", not_here: "not_here", no_item: "no_item",
      inventory_full: "inventory_full", menu_open: "menu_open", too_late: "too_late", shop_closed: "shop_closed", wrong_season: "wrong_season",
      needs_upgrade: "needs_upgrade", interrupted: "interrupted", timeout: "timeout", no_money: "no_money", invalid_args: "invalid_args",
      not_found: "not_found", not_ready: "not_ready",
    },
    results: [],            // no rewriting: the mod's own (English) result line is shown, shortened
    season: { spring: "Spring", summer: "Summer", fall: "Fall", winter: "Winter" },
    // action verb for the ACTION line and the status line
    tool: {
      walk_to: "walking", use_tool: "using a tool", plant: "planting", harvest: "harvesting", interact: "interacting",
      talk_to: "talking", travel_to: "traveling", buy: "buying", ship: "shipping", eat: "eating", wait: "waiting",
      go_to_bed: "going to bed", respond: "replying", close_menu: "closing the menu", shop_list: "browsing the shop"
    },
    // short terminal-style name for the LOG column
    toolLog: {
      walk_to: "move", use_tool: "tool", plant: "plant", harvest: "harvest", interact: "use",
      talk_to: "talk", travel_to: "travel", buy: "buy", ship: "ship", eat: "eat", wait: "wait",
      go_to_bed: "sleep", respond: "reply", close_menu: "close", shop_list: "shop"
    },
    place: {
      FarmHouse: "Farmhouse", Farm: "Farm", BusStop: "Bus Stop", Town: "Town", SeedShop: "Pierre's shop",
      Beach: "Beach", Mountain: "Mountain", Forest: "Forest", Saloon: "Saloon", Blacksmith: "Blacksmith",
      AnimalShop: "Marnie's ranch", ScienceHouse: "Robin's house", Mine: "Mines", Hospital: "Clinic", JojaMart: "Joja Mart",
      ArchaeologyHouse: "Museum", Woods: "Secret Woods", CommunityCenter: "Community Center", FishShop: "Willy's shop"
    },
    // demo feed (?mock=1): what the model "says", so it should read like ThoughtLanguage
    mock: {
      plan: "Day 1, spring. I have 500g and full energy. The plan is to look over the land, clear the grass, stumps and rocks, then till and plant my 15 parsnip seeds, after finding the way out through the bottom door at (3,11)",
      walkDoor: "Walk toward the door out of the house", walkOut: "Step out of the door and head down",
      goFarm: "Head out to the farm", breakRocks: "[sample] Break rocks in front of the house", greet: "[sample] Say hi to Pierre",
      thinkReply: "[sample] Haiku's thoughts on how to answer Pierre", replyPolite: "[sample] Pick the polite answer",
      goBed: "[sample] Go home to bed", diary: "[sample] Tonight's diary entry",
      mockWait: "Waiting for usage limit reset (until 03:00)"
    }
  },
  th: {
    waiting: "รอเกม…",
    pausedBadge: "หยุดชั่วคราว", stoppedBadge: "หยุดการรัน",
    modeHeldAction: (stopNow, verb) => `${stopNow ? "หยุดการรัน" : "หยุดชั่วคราว"} · รอให้${verb}จบ`,
    dayWord: "วันที่", diaryWord: "บันทึก",
    actIdle: "ทำ: ?", actReplyIdle: "ตอบ: ?", actThinking: "กำลังคิด…",
    actDoing: verb => `ทำ: ${verb}`,
    actResult: (ok, line, mark = ok ? "✓" : "✗") => `ผล: ${mark} ${line}`,
    modeRunning: "เวลาเดิน",
    modeRunningAction: verb => `เวลาเดิน · กำลัง${verb}…`,
    modeFrozenTalk: who => `หยุดเวลา · คุยกับ ${who}`,
    modeFrozenThink: who => `หยุดเวลา · ${who} กำลังคิด`,
    statMoney: "เงินเมื่อวาน", statOk: "ทำสำเร็จ", statBad: "พลาด", inBed: "เข้านอนแล้ว",
    dayCardSeason: (season, dom, year) => `${season} วันที่ ${dom} · ปี ${year}`,
    diarySub: (day, season, dom, year) => `คืนวันที่ ${day} · ${season} ${dom} · ปี ${year}`,
    diaryTitle: who => `บันทึกของ ${who}`,
    optionN: n => `ข้อ ${n}`, optionNext: "กดคุยต่อ",
    resultDone: "สำเร็จ", resultFailed: "ไม่สำเร็จ",
    stoppedShort: (x, y) => `ไปไม่ถึง หยุดที่ (${x},${y})`,
    reasons: {
      partial: "ทำได้บางส่วน", low_energy: "พลังงานหมด", no_path: "ไม่มีทางไป", not_here: "ไม่ได้อยู่ตรงนี้", no_item: "ไม่มีของ",
      inventory_full: "กระเป๋าเต็ม", menu_open: "มีเมนูเปิดอยู่", too_late: "สายเกินไป", shop_closed: "ร้านปิด", wrong_season: "ผิดฤดู",
      needs_upgrade: "ต้องอัปเกรด", interrupted: "ถูกขัดจังหวะ", timeout: "หมดเวลา", no_money: "เงินไม่พอ", invalid_args: "ใส่ค่าผิด",
      not_found: "ไม่พบ", not_ready: "เกมยังไม่พร้อม",
    },
    // English mod results -> short Thai for viewers
    results: [
      [/^No known route from (\w+) to (\w+)/, (m) => `ไม่รู้ทางจาก${place(m[1])}ไป${place(m[2])}`],
      [/^Arrived in (\w+)/, (m) => `ถึง${place(m[1])}แล้ว`],
      [/^Arrived at \((\d+),\s*(\d+)\)/, (m) => `ถึง (${m[1]},${m[2]})`],
      [/^No walkable path/, () => "เดินไปไม่ได้"],
      [/^Interacted with/, () => "กดแล้ว"],
      [/^Menu closed|^No menu open/, () => "ปิดเมนูแล้ว"],
      [/^Talking to (.+?) \(friendship (\d+)/, (m) => `เริ่มคุยกับ ${m[1]} (หัวใจ ${m[2]})`],
      [/^Dialogue closed/, () => "คุยจบ"],
      [/^Dialogue continued/, () => "คุยต่อ"],
      [/^This is a question/, () => "ต้องเลือกข้อก่อน"],
      [/^No dialogue is open/, () => "ไม่มีบทสนทนาเปิดอยู่"],
      [/^Couldn't start a conversation with (\S+)/, (m) => `คุยกับ ${m[1]} ไม่ได้`],
      [/^(\S+) is not on this map/, (m) => `${m[1]} ไม่อยู่แถวนี้`],
      [/^Tried to sleep but the day did not change/, () => "นอนแล้วแต่วันไม่เปลี่ยน"],
      [/^No "(.+?)" in inventory/, (m) => `ไม่มี ${m[1]} ในกระเป๋า`],
    ],
    season: { spring: "ฤดูใบไม้ผลิ", summer: "ฤดูร้อน", fall: "ฤดูใบไม้ร่วง", winter: "ฤดูหนาว" },
    tool: {
      walk_to: "เดิน", use_tool: "ใช้เครื่องมือ", plant: "ปลูก", harvest: "เก็บเกี่ยว", interact: "กดใช้",
      talk_to: "คุย", travel_to: "เดินทาง", buy: "ซื้อ", ship: "ส่งขาย", eat: "กิน", wait: "รอเวลา",
      go_to_bed: "เข้านอน", respond: "ตอบ", close_menu: "ปิดเมนู", shop_list: "ดูของในร้าน"
    },
    place: {
      FarmHouse: "ในบ้าน", Farm: "ฟาร์ม", BusStop: "ป้ายรถเมล์", Town: "ในเมือง", SeedShop: "ร้าน Pierre",
      Beach: "ชายหาด", Mountain: "ภูเขา", Forest: "ป่า", Saloon: "ร้าน Saloon", Blacksmith: "ร้านตีเหล็ก",
      AnimalShop: "ร้าน Marnie", ScienceHouse: "บ้าน Robin", Mine: "เหมือง", Hospital: "คลินิก", JojaMart: "Joja Mart",
      ArchaeologyHouse: "พิพิธภัณฑ์", Woods: "ป่าลึก", CommunityCenter: "ศูนย์ชุมชน", FishShop: "ร้าน Willy"
    },
    mock: {
      plan: "วันที่ 1 ฤดูใบไม้ผลิ มีเงิน 500g และพลังงานเต็ม แผนคือไปดูที่ดิน ถางหญ้า ตอไม้ และก้อนหินให้โล่ง แล้วไถพรวนปลูกพาร์สนิปที่มีอยู่ 15 เมล็ด ก่อนหาทางออกจากบ้านทางประตูล่างที่ (3,11)",
      walkDoor: "เดินไปทางประตูออกบ้าน", walkOut: "เดินออกจากประตูบ้านลงไปข้างล่าง",
      goFarm: "ออกไปที่ฟาร์ม", breakRocks: "[ตัวอย่าง] ทุบหินหน้าบ้าน", greet: "[ตัวอย่าง] ทักทาย Pierre",
      thinkReply: "[ตัวอย่าง] ความคิดของ Haiku ว่าจะตอบ Pierre ยังไง", replyPolite: "[ตัวอย่าง] เลือกตอบแบบสุภาพ",
      goBed: "[ตัวอย่าง] กลับบ้านไปนอน", diary: "[ตัวอย่าง] ไดอารี่ของคืนนั้น",
      mockWait: "รอ usage limit รีเซ็ต (ถึง 03:00)"
    }
  },
};
// "Thai" / "English" / "th" / "en-US" -> a table code; blank = the mod's default (Thai); anything else -> en
function pickLang(name) {
  const k = String(name == null ? "" : name).trim().toLowerCase() || "thai";
  const code = LANG_NAMES[k] || k.split(/[-_]/)[0];
  return I18N[code] ? code : "en";
}
// ====== i18n:end ========================================================================================

let L = null, langKey = null;                // the table in use (null until the language is known)
const LANG_PARAM = new URLSearchParams(location.search).get("lang");
const hasOwn = (o, k) => Object.prototype.hasOwnProperty.call(o, k);
// string (or function result) from the current table, falling back to `en`
function t(key, ...a) { const v = L && hasOwn(L, key) ? L[key] : I18N.en[key]; return typeof v === "function" ? v(...a) : v; }
// one entry of a group table (season, tool, toolLog, place)
function lk(group, key) { const g = L && L[group]; return g && hasOwn(g, key) ? g[key] : hasOwn(I18N.en[group], key) ? I18N.en[group][key] : undefined; }
function setLang(name) {
  const key = pickLang(LANG_PARAM || name);
  if (key === langKey) return;
  langKey = key; L = I18N[key];
  document.documentElement.lang = key;
  document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = t(el.dataset.i18n); });
  document.body.classList.add("i18n");
}
const place = n => lk("place", n) || n || "–";
const seasonName = n => lk("season", n) || n;
const C = { plain: "var(--text)", think: "var(--think)", act: "var(--act)", bad: "var(--bad)", dim: "var(--dim)", ok: "var(--ok-mark)" };

function resultLine(text, ok) {
  const line = (text || "").split("\n")[0];
  for (const [re, fn] of t("results")) { const m = line.match(re); if (m) return fn(m); }
  if (!line) return ok ? t("resultDone") : t("resultFailed");
  return line.length > 38 ? line.slice(0, 36) + "…" : line;
}

const reasonLabel = r => (r && r !== "ok" && r !== "other" && r !== "error") ? (lk("reasons", r) || r) : "";

// one result line for an action: ok flag + short line for viewers. A partial result is ok, but marked ◐.
function judge(tool, args, e) {
  let ok = e.ok !== false, line = resultLine(e.text, ok);
  const partial = ok && e.partial === true, reason = e.reason || null;
  // asked for one tile, stopped on another: count it as a miss
  const m = (e.text || "").match(/^Arrived at \((\d+),\s*(\d+)\)/);
  if (tool === "walk_to" && m && args && args.x !== undefined && (+m[1] !== +args.x || +m[2] !== +args.y)) { ok = false; line = t("stoppedShort", m[1], m[2]); }
  // lead with the reason unless a results sentence already says it
  const label = reasonLabel(reason), known = (t("results") || []).some(([re]) => re.test((e.text || "").split("\n")[0]));
  if (label && (!ok || partial) && !known) line = `${label} · ${line}`;
  return { ok, line, partial, reason, mark: !ok ? "✗" : partial ? "◐" : "✓" };
}

// ✓/✗ counts and start-of-day money from a whole day's log (survives overlay reloads)
function tally(entries) {
  let act = null, ok = 0, bad = 0, money = null;
  for (const e of entries) {
    if (money === null && typeof e.money === "number") money = e.money;
    if (e.kind === "action") act = e;
    else if (e.kind === "result" && act && act.tool === e.tool) { judge(act.tool, act.args, e).ok ? ok++ : bad++; act = null; }
  }
  return { ok, bad, money };
}

function target(tool, args) {
  args = args || {};
  if (tool === "respond") return args.option !== undefined && args.option !== null ? t("optionN", Number(args.option) + 1) : t("optionNext");
  if (args.location) return "→ " + place(args.location);
  if (args.name) return args.name;
  if (args.item) return args.item;
  if (args.x !== undefined && args.y !== undefined) return `(${args.x},${args.y})`;
  return "";
}

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

let after = 0, typing = null, lastDay = null, booted = false;
let modelShort = "", meta = {};             // from feed meta, so the overlay follows whichever model is playing
const who = () => modelShort || "AI";
let cur = { action: null, result: null };   // current act → result
let hist = [];                              // finished actions (latest last)
let talk = null;                            // fallback NPC detection when state.dialogue is absent
// night sequence: diary entry (held) → "Sleeping..." (show diary) → day ticks over + "New day" → day card
let pendingDiary = null, diaryAt = 0, diaryTimer = null;
let newDayFor = null, sleepDone = false;
const DIARY_MIN_MS = 12000;                 // keep the diary up at least this long before the day card replaces it

function typeText(text) {
  clearInterval(typing);
  let i = 0;
  const draw = () => {
    const shown = esc(text.slice(0, i)) + (i < text.length ? '<span class="caret"> ▍</span>' : "");
    $("thinkText").innerHTML = shown; $("replyText").innerHTML = shown;
  };
  draw();
  typing = setInterval(() => { i++; draw(); if (i >= text.length) clearInterval(typing); }, 22);
}

function finishAction() { if (cur.action) hist.push(cur); if (hist.length > 30) hist = hist.slice(-30); cur = { action: null, result: null }; }

function onEntry(e, state) {
  after = Math.max(after, e.seq);
  if (e.kind === "think") {
    finishAction();
    typeText(e.text || "");
  } else if (e.kind === "action") {
    if (cur.action) finishAction();
    cur.action = { tool: e.tool, why: e.text || "", args: e.args || {} };
    if (e.tool !== "talk_to" && e.tool !== "respond" && e.tool !== "close_menu") talk = null;
  } else if (e.kind === "result") {
    if (cur.action && cur.action.tool === e.tool && !cur.result) cur.result = judge(e.tool, cur.action.args, e);
    const t = (e.text || "").match(/^Talking to (.+?) \(/);
    if (e.tool === "talk_to" && e.ok !== false && t) talk = t[1];
    if (/^Dialogue closed/.test(e.text || "") || e.tool === "close_menu") talk = null;
    if (e.tool === "go_to_bed" && e.ok === false) hideDiary(); // the diary written by journal stays pending for the next go_to_bed
  } else if (e.kind === "diary") {
    // logged by the journal tool (any time before go_to_bed); held until the mod logs that the player is actually in bed
    pendingDiary = { text: e.text || "", sub: diarySub(state) };
  } else if (e.kind === "system") {
    if (/^Sleeping/.test(e.text || "") && pendingDiary) {
      if (booted) showDiary(pendingDiary);
      pendingDiary = null;
    }
    if (/^New day|^Passed out/.test(e.text || "")) sleepDone = true;
  }
}

function renderLog() {
  $("hist").innerHTML = hist.slice(-4).map(h => {
    const ok = h.result ? h.result.ok : null;
    const mark = ok === null ? "…" : h.result.mark;
    const color = ok === null ? C.dim : !ok ? "var(--bad-mark)" : h.result.partial ? C.act : C.ok;
    const tool = lk("toolLog", h.action.tool) || h.action.tool;
    return `<div class="hist"><span class="tool">${esc(tool)}</span><span class="why">${esc(h.action.why || target(h.action.tool, h.action.args))}</span><span class="mark" style="color:${color}">${mark}</span></div>`;
  }).join("");
}

function renderAction(frozen, speaker) {
  const a = cur.action, r = cur.result;
  let text, color;
  if (r) { text = t("actResult", r.ok, r.line, r.mark); color = !r.ok ? C.bad : r.partial ? C.act : C.ok; }
  else if (a) { text = `${t("actDoing", lk("tool", a.tool) || a.tool)} ${target(a.tool, a.args)}`.trim(); color = C.act; }
  else if (frozen) { text = t("actThinking"); color = C.think; }
  else { text = speaker ? t("actReplyIdle") : t("actIdle"); color = C.dim; }
  const el = $("actLine");
  el.textContent = text; el.style.color = color;
}

function clock() {
  const d = new Date(), p = n => String(n).padStart(2, "0");
  const off = -d.getTimezoneOffset(), sign = off >= 0 ? "+" : "-", oh = Math.floor(Math.abs(off) / 60), om = Math.abs(off) % 60;
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())} ${sign}${p(oh)}${om ? p(om) : ""}`;
}

async function showDayCard(s) {
  const st = tally(((await fetchDay(s.day - 1)) || {}).entries || []);
  hideDiary();
  $("dcSeason").textContent = t("dayCardSeason", seasonName(s.season), s.dayOfMonth, s.year);
  $("dcDay").textContent = s.day;
  $("cells").innerHTML = Array.from({ length: 100 }, (_, i) => `<i class="${i + 1 < s.day ? "past" : i + 1 === s.day ? "now" : ""}"></i>`).join("");
  const dm = st.money !== null && typeof s.money === "number" ? s.money - st.money : null;
  $("dcMoney").textContent = dm === null ? "–" : `${dm >= 0 ? "+" : "−"}${Math.abs(dm).toLocaleString()}g`;
  $("dcOk").textContent = st.ok;
  $("dcBad").textContent = st.bad;
  $("daycard").classList.add("show");
  setTimeout(() => $("daycard").classList.remove("show"), 5000);
}

// day card waits for the agent's sleep to finish (or no agent sleep at all) and for the diary's minimum time
function maybeDayCard(s) {
  if (newDayFor === null || !s.ready) return;
  if (!sleepDone && s.action === "go_to_bed") return;
  if ($("diary").classList.contains("show") && Date.now() - diaryAt < DIARY_MIN_MS) return;
  newDayFor = null; sleepDone = false;
  showDayCard(s);
}

function diarySub(s) {
  return s && s.ready ? t("diarySub", s.day, seasonName(s.season), s.dayOfMonth, s.year) : "";
}

function showDiary(d) {
  $("dyTitle").textContent = t("diaryTitle", who());
  $("dySub").textContent = d.sub;
  $("dyFoot").textContent = `${meta.modelId || "–"}${meta.session ? " · session " + meta.session.slice(0, 8) : ""}`;
  const box = $("diaryText");
  box.textContent = d.text;
  box.className = d.text.length > 400 ? "longer" : d.text.length > 220 ? "long" : "";
  $("diary").classList.add("show");
  diaryAt = Date.now();
  clearTimeout(diaryTimer);
  diaryTimer = setTimeout(hideDiary, 180000); // safety net if the night never completes
}
function hideDiary() { clearTimeout(diaryTimer); $("diary").classList.remove("show"); }

async function poll() {
  try {
    const d = await fetchFeed(after);
    setLang(d.thoughtLanguage);
    const s = d.state || {};
    meta = d.meta || {};
    if (meta.model) modelShort = meta.model.replace(/^Claude\s+/i, "").trim();
    const runnerStatus = (meta.runnerStatus || "").trim();   // set by the runner (e.g. usage-limit wait); "" clears it
    $("runnerText").textContent = runnerStatus;
    $("runnerLine").classList.toggle("hide", !runnerStatus);
    document.body.classList.toggle("runner", !!runnerStatus);
    for (const e of d.entries || []) onEntry(e, s);
    booted = true;

    // NPC dialogue: prefer the mod's state.dialogue; older builds fall back to talk_to/respond results.
    // Boxes with no speaker (sleep prompt, TV, signs) are not conversations.
    const speaker = "dialogue" in s ? (s.dialogue && s.dialogue.speaker) || null : talk;
    document.body.classList.toggle("npc", !!speaker);
    $("replyLabel").textContent = t("replyTo", String(speaker || "NPC").toUpperCase());

    if (s.ready) {
      $("day").textContent = s.day;
      $("place").textContent = place(s.location);
      if (lastDay !== null && s.day > lastDay) newDayFor = s.day;
      lastDay = s.day;
      maybeDayCard(s);
    }

    let mode, color;
    const held = !!(s.paused || s.stopNow);
    const heldBadge = s.stopNow ? t("stoppedBadge") : t("pausedBadge");
    $("pauseBadge").textContent = heldBadge;
    $("pauseBadge").classList.toggle("hide", !held);
    if (!s.ready) { mode = t("waiting"); color = C.dim; }
    else if (held) { mode = s.action ? t("modeHeldAction", s.stopNow, lk("tool", s.action) || s.action) : heldBadge; color = C.bad; }
    else if (s.action) { mode = t("modeRunningAction", lk("tool", s.action) || s.action); color = C.act; }
    else if (s.frozen) { mode = speaker ? t("modeFrozenTalk", speaker) : t("modeFrozenThink", who()); color = C.think; }
    else { mode = t("modeRunning"); color = C.act; }
    $("modeText").textContent = mode;
    $("modeDot").style.background = color;

    renderLog();
    renderAction(!!s.frozen && !s.action, speaker);
    $("proof").innerHTML = `<div><span class="live">●</span> ${t("liveWord")} · ${esc(meta.modelId || "–")}${meta.session ? " · " + t("sessionWord") + " " + esc(meta.session.slice(0, 8)) : ""}</div>`
      + `<div>${t("seqWord")} ${after} · ${clock()}</div>`;
  } catch (e) { if (!L) setLang(null); /* game not running yet */ }
  setTimeout(poll, 400);
}

// ?mock=1 replays a short scripted feed so the overlay can be designed without the game
const MOCK = new URLSearchParams(location.search).has("mock");
let mockT = 0, mockLog = [], mockState = {}, mockSteps = null;
const mockScript = M => [
  [{ frozen: true }, { kind: "think", text: M.plan }],
  [{ frozen: true, action: "walk_to" }, { kind: "action", tool: "walk_to", text: M.walkDoor, args: { x: 3, y: 10 } }],
  [{ frozen: true, action: null }, { kind: "result", tool: "walk_to", text: "Arrived at (3,10).", ok: true }],
  [{}, { kind: "action", tool: "walk_to", text: M.walkOut, args: { x: 3, y: 12 } }],
  [{}, { kind: "result", tool: "walk_to", text: "Arrived at (3,11).", ok: true }],
  [{}, { kind: "action", tool: "travel_to", text: M.goFarm, args: { location: "Farm" } }],
  [{}, { kind: "result", tool: "travel_to", text: "No known route from FarmHouse to Farm.", ok: false, reason: "no_path" }],
  [{}, { kind: "action", tool: "use_tool", text: M.breakRocks, args: { tool: "Pickaxe", direction: "down" } }],
  [{}, { kind: "result", tool: "use_tool", text: "Stopped: energy too low (2). Used the Pickaxe 12 times.", ok: true, reason: "low_energy", partial: true }],
  [{ location: "SeedShop" }, { kind: "action", tool: "talk_to", text: M.greet, args: { name: "Pierre" } }],
  [{ dialogue: { speaker: "Pierre" } }, { kind: "result", tool: "talk_to", text: "Talking to Pierre (friendship 0 hearts).", ok: true }],
  [{}, { kind: "think", text: M.thinkReply }],
  [{}, { kind: "action", tool: "respond", text: M.replyPolite, args: { option: 1 } }],
  [{ dialogue: null }, { kind: "result", tool: "respond", text: "Dialogue closed.", ok: true }],
  [{ action: "go_to_bed", money: 480 }, { kind: "action", tool: "go_to_bed", text: M.goBed, args: {} }],
  [{}, { kind: "diary", text: M.diary }],
  [{ location: "FarmHouse", dialogue: { speaker: null, question: true } }, { kind: "system", text: "Walking home…" }],
  [{ dialogue: null }, { kind: "system", text: "Sleeping..." }],
  [{ day: 2, dayOfMonth: 2, money: 620 }, { kind: "system", text: "Shipping…" }],
  [{ action: null }, { kind: "system", text: "New day: farm day 2" }],
  [{}, { kind: "result", tool: "go_to_bed", text: "Good morning!", ok: true }],
];
const API = (new URLSearchParams(location.search).get("api") || (location.port === "8770" ? "" : "http://localhost:8770")).replace(/\/$/, "");
async function fetchFeed(after) {
  if (!MOCK) { const r = await fetch(`${API}/api/feed?after=${after}`); return r.json(); }
  const mockLang = pickLang(LANG_PARAM);
  const M = { ...I18N.en.mock, ...I18N[mockLang].mock };
  if (!mockSteps) mockSteps = mockScript(M);
  if (!mockT) mockState = { ready: true, day: 1, season: "spring", dayOfMonth: 1, year: 1, location: "FarmHouse", money: 500, frozen: true, action: null, dialogue: null };
  const i = Math.floor(mockT++ / 10); // one scripted step every ~4 s
  if (mockT % 10 === 1 && mockSteps[i]) {
    const [patch, entry] = mockSteps[i];
    Object.assign(mockState, patch);
    mockLog.push({ seq: mockLog.length + 1, day: mockState.day, money: mockState.money, ...entry });
  }
  const mockMeta = { model: "Claude Haiku 5.5", modelId: "claude-haiku-5-5", session: "mock0000", run: "mock" };
  if (new URLSearchParams(location.search).has("mockwait")) mockMeta.runnerStatus = M.mockWait;  // ?mock=1&mockwait=1
  return { state: mockState, thoughtLanguage: LANG_PARAM, meta: mockMeta, entries: mockLog.filter(e => e.seq > after) };
}
async function fetchDay(n) {
  try {
    if (MOCK) return { day: n, entries: mockLog.filter(e => e.day === n) };
    const r = await fetch(`${API}/api/day?n=${n}`); return r.json();
  } catch (e) { return null; }
}

poll();
</script>
</body>
</html>
