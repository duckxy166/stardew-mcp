<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Haiku Replay</title>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root { --bg: #f7f1e3; --card: #fffaf0; --ink: #2b2118; --muted: #7a6a55; --edge: #e2d3b4; --accent: #c7782b; --ok: #3f8f2e; --bad: #c0392b; --think: #8a5a00; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1d1914; --card: #26211a; --ink: #f3ead8; --muted: #b3a58c; --edge: #3d342a; --accent: #e8a24a; --ok: #8fd16a; --bad: #ff7a6b; --think: #ffd27a; } }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: "Kanit", "Leelawadee UI", sans-serif; }
  header { padding: 16px; border-bottom: 1px solid var(--edge); display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; }
  header h1 { margin: 0; font-size: 22px; }
  header span { color: var(--muted); font-size: 14px; }
  main { display: grid; grid-template-columns: 180px 1fr; min-height: calc(100vh - 60px); }
  nav { border-right: 1px solid var(--edge); padding: 8px; overflow-y: auto; max-height: calc(100vh - 60px); }
  nav button { display: block; width: 100%; text-align: left; padding: 8px 10px; margin: 2px 0; background: none; border: 1px solid transparent; border-radius: 8px; color: var(--ink); font: inherit; cursor: pointer; }
  nav button.on { background: var(--card); border-color: var(--edge); color: var(--accent); }
  section { padding: 16px; overflow-y: auto; max-height: calc(100vh - 60px); }
  .diary { background: var(--card); border: 1px solid var(--edge); border-radius: 12px; padding: 12px 16px; white-space: pre-wrap; margin-bottom: 14px; }
  .filters { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; font-size: 14px; color: var(--muted); }
  .row { display: grid; grid-template-columns: 70px 90px 1fr; gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--edge); font-size: 15px; }
  .row .t { color: var(--muted); font-variant-numeric: tabular-nums; }
  .row .k { font-size: 13px; color: var(--muted); }
  .row.think .txt { color: var(--think); font-size: 17px; }
  .row .res { color: var(--muted); font-size: 13px; white-space: pre-wrap; }
  body:not(.i18n) { visibility: hidden; } /* nothing shows until the language is known */
  .ok { color: var(--ok); } .bad { color: var(--bad); }
  @media (max-width: 700px) { main { grid-template-columns: 1fr; } nav { display: flex; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--edge); } nav button { width: auto; white-space: nowrap; } .row { grid-template-columns: 56px 1fr; } .row .k { display: none; } }
</style>
</head>
<body>
<header><h1 data-i18n="title"></h1><span id="sum"></span></header>
<main>
  <nav id="days"></nav>
  <section>
    <div class="filters">
      <label><input type="checkbox" id="fThink" checked> <span data-i18n="fThink"></span></label>
      <label><input type="checkbox" id="fAct" checked> <span data-i18n="fAct"></span></label>
      <label><input type="checkbox" id="fRes" checked> <span data-i18n="fRes"></span></label>
      <label><input type="checkbox" id="fSys" checked> <span data-i18n="fSys"></span></label>
    </div>
    <div id="diary" class="diary" data-i18n="pickDay"></div>
    <div id="rows"></div>
  </section>
</main>
<script>
const $ = id => document.getElementById(id);
let current = null, data = null;
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

const API = (new URLSearchParams(location.search).get("api") || (location.port === "8770" ? "" : "http://localhost:8770")).replace(/\/$/, "");

// ====== i18n:begin ======================================================================================
// Every viewer-facing string of this page. The mod reports ThoughtLanguage in /api/feed (`thoughtLanguage`);
// ?lang=Thai|English overrides it. `en` is the complete base table; the other tables only list what differs,
// and a missing key falls back to `en`. To add a language: add a table under its code (ja, ...) and, when its
// ThoughtLanguage name differs from the code, a LANG_NAMES entry. A language without a table shows `en`.
const LANG_NAMES = { thai: "th", english: "en" };
const I18N = {
  en: {
    title: "Claude Haiku plays Stardew — Replay",
    fThink: "Thoughts", fAct: "Actions", fRes: "Results", fSys: "System",
    pickDay: "Pick a day on the left",
    noDiary: "(no diary for this day yet)",
    dayButton: d => `Day ${d}`,
    summary: (day, acts, fails, mins) => `Day ${day} · ${acts} actions · ${fails} failed · ~${mins} min real time`,
    rowThink: "💭 think",
  },
  th: {
    title: "Claude Haiku เล่น Stardew — Replay",
    fThink: "ความคิด", fAct: "การกระทำ", fRes: "ผลลัพธ์", fSys: "ระบบ",
    pickDay: "เลือกวันทางซ้าย",
    noDiary: "(ยังไม่มีไดอารี่วันนี้)",
    dayButton: d => `วันที่ ${d}`,
    summary: (day, acts, fails, mins) => `วันที่ ${day} · ${acts} actions · ล้มเหลว ${fails} · ใช้เวลาจริง ~${mins} นาที`,
    rowThink: "💭 คิด",
  },
};
// "Thai" / "English" / "th" / "en-US" -> a table code; blank = the mod's default (Thai); anything else -> en
function pickLang(name) {
  const k = String(name == null ? "" : name).trim().toLowerCase() || "thai";
  const code = LANG_NAMES[k] || k.split(/[-_]/)[0];
  return I18N[code] ? code : "en";
}
// ====== i18n:end ========================================================================================
const LANG_PARAM = new URLSearchParams(location.search).get("lang");
const hasOwn = (o, k) => Object.prototype.hasOwnProperty.call(o, k);
let L = I18N.en;
function t(key, ...a) { const v = hasOwn(L, key) ? L[key] : I18N.en[key]; return typeof v === "function" ? v(...a) : v; }
function setLang(name) {
  const key = pickLang(LANG_PARAM || name);
  L = I18N[key];
  document.documentElement.lang = key;
  document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = t(el.dataset.i18n); });
  document.body.classList.add("i18n");
}
// /api/feed always carries thoughtLanguage (even before a save is loaded); an `after` past the end keeps the reply tiny
async function initLang() {
  let name = null;
  if (!LANG_PARAM) try { name = (await (await fetch(`${API}/api/feed?after=9007199254740991`)).json()).thoughtLanguage; } catch (e) { /* default */ }
  setLang(name);
}

async function loadDays() {
  const days = await (await fetch(`${API}/api/days`)).json();
  $("days").innerHTML = days.map(d => `<button data-d="${d}">${t("dayButton", d)}</button>`).join("");
  $("days").querySelectorAll("button").forEach(b => b.onclick = () => show(+b.dataset.d));
  if (days.length) show(days[days.length - 1]);
}

async function show(d) {
  current = d;
  $("days").querySelectorAll("button").forEach(b => b.classList.toggle("on", +b.dataset.d === d));
  data = await (await fetch(`${API}/api/day?n=${d}`)).json();
  render();
}

function render() {
  if (!data) return;
  $("diary").textContent = data.diary || t("noDiary");
  const show = { think: $("fThink").checked, action: $("fAct").checked, result: $("fRes").checked, system: $("fSys").checked, diary: true };
  const es = data.entries;
  const acts = es.filter(e => e.kind === "action").length;
  const fails = es.filter(e => e.kind === "result" && e.ok === false).length;
  const t0 = es[0]?.ts, t1 = es[es.length - 1]?.ts;
  const mins = t0 && t1 ? Math.round((new Date(t1) - new Date(t0)) / 60000) : 0;
  $("sum").textContent = t("summary", data.day, acts, fails, mins);
  $("rows").innerHTML = es.filter(e => show[e.kind]).map(e => {
    if (e.kind === "think") return `<div class="row think"><span class="t">${e.gameTime}</span><span class="k">${t("rowThink")}</span><span class="txt">${esc(e.text)}</span></div>`;
    if (e.kind === "action") return `<div class="row"><span class="t">${e.gameTime}</span><span class="k">▶ ${esc(e.tool)}</span><span>${esc(e.text)} <span class="res">${esc(e.args ? JSON.stringify(e.args) : "")}</span></span></div>`;
    if (e.kind === "result") return `<div class="row"><span class="t">${e.gameTime}</span><span class="k ${e.ok ? "ok" : "bad"}">${e.ok ? "✓" : "✗"} ${esc(e.tool)}</span><span class="res">${esc(e.text)} (${e.ms} ms)</span></div>`;
    return `<div class="row"><span class="t">${e.gameTime}</span><span class="k">${e.kind}</span><span>${esc(e.text)}</span></div>`;
  }).join("");
}
["fThink", "fAct", "fRes", "fSys"].forEach(id => $(id).onchange = render);
initLang().then(loadDays);
</script>
</body>
</html>
